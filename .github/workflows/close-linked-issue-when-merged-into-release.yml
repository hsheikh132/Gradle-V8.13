name: Close linked issues when PR merged into release

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - release7x

permissions:
  issues: write

jobs:
  closeIssueOnPrMerge:
    runs-on: ubuntu-latest
    steps:
      - name: Closes issues related to a merged pull request.
        uses: ldez/gha-mjolnir@2b6cbdc86ddbe6e54b4f8056f7d6e60825313336
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
